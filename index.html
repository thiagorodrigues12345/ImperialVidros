<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperial Vidros</title>
    <link rel="stylesheet" href="style/index.css">

</head>

<body>
    <!-- Cabeçalho/menu -->
    <header>
        <div class="topo">
                          <!-- logo da empresa -->
                          <div class="logo">
                                 <img src="assets/logologo.png" alt="Logo da empresa Imperial Vidros">
                          </div>
                          <!-- caixa de pesquisa -->
                          <div class="caixa-pesquisa">
                                <input type="text" placeholder="O que você procura?">
                                <img src="assets/pesquisa.png" alt="Ícone de pesquisa">
                          </div>
                          <!-- ícones -->
                          <div class="icones">
                            <a href="#">
                                <img src="assets/carrinho.png" alt="carrinho">
                                <small>Meu</small>
                                <p>CARRINHO</p>
                            </a>
                            <a href="#">
                                <img src="assets/user.png" alt="login">
                                <small> Olá visitante</small>
                                <p>ENTRAR</p>
                            </a>

                          </div>
        </div>

        <!-- menu de navegação -->
        </div>
        <nav class="menu">
            <a href="#">HOME</a>
            <a id="idprodutos" href="#">PRODUTOS</a>
            <a href="#">Vidro Comum</a>
            <a href="#">Vidro Canelado</a>
            <a href="#">Espelhos</a>
            <a href="#">Ferragens</a>
            <a href="#">SERVIÇOS</a>
            <a href="#">PROJETOS</a>
            
            

        </nav>
    </header>

     <!--AREA DO BANNER DA LOJA-->
     <div class="banner">
        <div class="imagens-banner">
            <img src="assets/banner1.png" alt="Banner 1">
        </div>
        <div class="botoes-banner">
            
    </div>


    <section class="Destaques">
    <div class="titulo-Destaques">
           <h2>Destaques</h2>
           <a href="#" class="ver-tudo">Ver tudo</a>
        </div>
         
        <div class="lista-produtos">
            <div class="card-produtos">
                <img src="assets/vidrocomum.png" alt="Produto 1">
                <h3>Vidro Comum</h3>
                <p>R$ 90,00</p>
                <h3>Espessura</h3>
                <p>3mm</p>
                <p>4mm</p>
                <p>6mm</p>



        </div>
        


        </section>

</body>
</html>

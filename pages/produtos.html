<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto</title>
    <!--Conexão com css-->
    <link rel="stylesheet" href="/style/produto.css">
    <!--logo da empresa para o navegador-->
    <link rel="icon" type="image/png" 
    href="/assets/logo-navegadorb.png">
</head>


<body>
<header>
        <div class="topo">
            <!-- logo da empresa -->
            <div class="logo">
                <img src="/assets/logologo.png" alt="Logo da empresa Imperial Vidros">
            </div>
            <!-- caixa de pesquisa -->
            <div class="caixa-pesquisa">
                <input type="text" placeholder="O que você procura?">
                <img src="/assets/pesquisa.png" alt="Ícone de pesquisa">
            </div>
            <!-- ícones -->
            <div class="icones">
                <a href="#">
                    <img src="/assets/carrinho.png" alt="carrinho">
                    <small>Meu</small>
                    <p>CARRINHO</p>
                </a>
                <a href="#">
                    <img src="/assets/user.png" alt="login">
                    <small> Olá visitante</small>
                    <p>ENTRAR</p>
                </a>

            </div>
        </div>

        <!-- menu de navegação -->
        </div>
        <nav class="menu">
            <a href="#">HOME</a>
            <a id="idprodutos" href="#">PRODUTOS</a>
            <a href="#">Vidro Comum</a>
            <a href="#">Vidro Temperado</a>
            <a href="#">Espelhos</a>
            <a href="#">Ferragens</a>
            <a href="#">SERVIÇOS</a>
            <a href="#">PROJETOS</a>



        </nav>
    </header>
    
</body>
</html>
